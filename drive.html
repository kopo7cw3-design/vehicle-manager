<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>차량이용</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div id="app"><div class="card muted">불러오는 중…</div></div>
</div>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
const vid = new URLSearchParams(location.search).get('v');
const app = document.getElementById('app');
const LAST = 'carlog_driver';
const LAST_DEPT = 'carlog_dept';
let data;

function head(v) {
  return `<div class="card">
    <div class="vhead"><div><div class="muted">${esc(v['차종'])} · ${esc(v['부서'])}</div><div class="vnum">${esc(v['차량번호'])}</div></div>
    <span class="badge b-${esc(v['상태'])}">${esc(v['상태'])}</span></div></div>`;
}

async function load() {
  if (!vid) { app.innerHTML = '<div class="card">차량 정보가 없습니다. 차량의 QR코드를 다시 스캔하세요.</div>'; return; }
  try { data = await api('vehicle', { id: vid }); } catch (e) { app.innerHTML = `<div class="card" style="color:var(--err)">${esc(e.message)}</div>`; return; }
  const v = data.vehicle, t = data.openTrip;
  if (t) renderEnd(v, t);
  else if (v['상태'] === '정비') app.innerHTML = head(v) + '<div class="card">정비 중인 차량입니다. 운행할 수 없습니다.</div>';
  else renderStart(v);
  renderReserve(v);
}

function renderStart(v) {
  const saved = localStorage.getItem(LAST) || '';
  const savedDept = localStorage.getItem(LAST_DEPT) || '';
  app.innerHTML = head(v) + `
  <form class="card" id="f">
    <h2>🚗 운행 시작</h2>
    <label>운전자 이름</label>
    <input name="driver" list="drv" required pattern=".*[^ ].*" title="이름을 입력하세요" autocomplete="off" value="${esc(saved)}" placeholder="이름 입력 또는 선택">
    <datalist id="drv">${data.drivers.map(d => `<option value="${esc(d)}">`).join('')}</datalist>
    <label>부서</label>
    <input name="dept" required pattern=".*[^ ].*" title="부서를 입력하세요" autocomplete="off" value="${esc(savedDept)}" placeholder="예) 물류팀">
    <label>목적지</label>
    <input name="destination" required pattern=".*[^ ].*" title="목적지를 입력하세요" placeholder="예) 강남 고객사">
    <label>용무</label>
    <select name="purpose"><option>업무</option><option>영업</option><option>배송</option><option>출장</option><option>기타</option></select>
    <label>시작 km (계기판)</label>
    <input name="startKm" type="number" inputmode="numeric" min="0" required value="${esc(v['현재km'])}">
    <div class="hint">마지막 기록: ${num(v['현재km'])} km · 계기판과 다르면 수정하세요.</div>
    <label>비고 (선택)</label>
    <input name="note" placeholder="동승자, 특이사항 등">
    <button class="full" id="btn">운행 시작</button>
  </form>`;
  document.getElementById('f').onsubmit = async ev => {
    ev.preventDefault();
    const f = Object.fromEntries(new FormData(ev.target));
    await submit('start', { vehicleId: vid, ...f }, () => { localStorage.setItem(LAST, f.driver); localStorage.setItem(LAST_DEPT, f.dept); done('🚗 운행이 시작되었습니다', '안전운전하세요! 도착 후 같은 QR을 다시 스캔해 종료 km를 입력하세요.'); });
  };
}

function renderEnd(v, t) {
  app.innerHTML = head(v) + `
  <div class="card"><h2>운행 중</h2>
    <div class="kv"><span>운전자</span><b>${esc(t['운전자'])}</b><span>목적지</span><span>${esc(t['목적지'])} (${esc(t['용무'])})</span>
    <span>출발</span><span>${esc(t['출발시각'])} (${elapsed(t['출발시각'])} 경과)</span><span>시작 km</span><span>${num(t['시작km'])} km</span></div></div>
  <form class="card" id="f">
    <h2>🏁 운행 종료</h2>
    <label>종료 km (계기판)</label>
    <input name="endKm" id="endKm" type="number" inputmode="numeric" min="${esc(t['시작km'])}" required placeholder="${esc(t['시작km'])} 이상" autofocus>
    <div class="hint">주행거리: <span class="big" id="dist">-</span></div>
    <label>비고 (선택)</label>
    <input name="note" placeholder="특이사항">
    <button class="full" id="btn">운행 종료</button>
  </form>`;
  const km = document.getElementById('endKm');
  km.oninput = () => { const d = Number(km.value) - Number(t['시작km']); document.getElementById('dist').textContent = km.value && d >= 0 ? num(d) + ' km' : '-'; };
  document.getElementById('f').onsubmit = async ev => {
    ev.preventDefault();
    const f = Object.fromEntries(new FormData(ev.target));
    await submit('end', { vehicleId: vid, ...f }, r => done('🏁 운행이 종료되었습니다', `이번 주행거리 ${num(r.distance)} km. 수고하셨습니다!`));
  };
}

async function submit(action, body, ok) {
  const b = document.getElementById('btn'); b.disabled = true; b.textContent = '저장 중…';
  try { const r = await api(action, body, true); ok(r); }
  catch (e) { toast(e.message, false); b.disabled = false; b.textContent = action === 'start' ? '운행 시작' : '운행 종료'; }
}

function done(title, msg) {
  app.innerHTML = `${head(data.vehicle).replace(/<span class="badge.*?<\/span>/, '')}<div class="card" style="text-align:center"><h1>${title}</h1><p class="muted">${msg}</p><button class="ghost" onclick="load()">현재 상태 보기</button></div>`;
}
function fmt(x) { return String(x).slice(5, 16); }
function kst(ms) { return new Date(ms).toLocaleString('sv-SE', { timeZone: 'Asia/Seoul' }); }

function renderReserve(v) {
  const list = data.reservations || [];
  // 운행 시작 전, 지금 ~ 2시간 안에 다른 예약이 있으면 경고만 표시 (운행은 막지 않음)
  if (!data.openTrip) {
    const now = kst(Date.now()), soon = kst(Date.now() + 2 * 3600 * 1000);
    const near = list.filter(r => String(r['시작시각']) <= soon && String(r['종료시각']) > now);
    if (near.length) {
      const first = app.querySelector('.card');
      first.insertAdjacentHTML('afterend', `<div class="card" style="border-color:var(--warn)"><b style="color:var(--warn)">⚠️ 예약된 차량입니다</b>${near.map(r => `<div class="muted">${esc(fmt(r['시작시각']))} ~ ${esc(fmt(r['종료시각']))} · ${esc(r['예약자'])} (${esc(r['부서'])}) · ${esc(r['목적지'])}</div>`).join('')}<div class="hint">운행은 가능하지만 예약자와 먼저 확인하세요.</div></div>`);
    }
  }
  const rows = list.map(r => `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)"><span><b>${esc(fmt(r['시작시각']))} ~ ${esc(fmt(r['종료시각']))}</b><br><span class="muted">${esc(r['예약자'])} (${esc(r['부서'])}) · ${esc(r['목적지'])}</span></span><button type="button" class="ghost sm" onclick="cancelRes('${esc(r['예약ID'])}')">취소</button></div>`).join('') || '<div class="muted">예정된 예약이 없습니다.</div>';
  app.insertAdjacentHTML('beforeend', `
  <div class="card"><h2>📅 예약 현황</h2>${rows}</div>
  <details class="card" id="rsv"><summary style="font-weight:700;cursor:pointer">📅 이 차량 예약하기</summary>
    <form id="rf">
      <label>예약자 이름</label>
      <input name="name" required pattern=".*[^ ].*" title="이름을 입력하세요" autocomplete="off" value="${esc(localStorage.getItem(LAST) || '')}">
      <label>부서</label>
      <input name="dept" required pattern=".*[^ ].*" title="부서를 입력하세요" autocomplete="off" value="${esc(localStorage.getItem(LAST_DEPT) || '')}" placeholder="예) 물류팀">
      <label>목적지</label>
      <input name="destination" required pattern=".*[^ ].*" title="목적지를 입력하세요" placeholder="예) 강남 고객사">
      <label>사용 시작</label>
      <input type="datetime-local" name="start" required>
      <label>사용 종료</label>
      <input type="datetime-local" name="end" required>
      <label>취소번호 (숫자 4자리)</label>
      <input name="pin" required inputmode="numeric" pattern="[0-9]{4}" maxlength="4" title="숫자 4자리를 입력하세요" placeholder="예약 취소할 때 필요합니다">
      <button class="full" id="rbtn">예약하기</button>
    </form>
  </details>`);
  document.getElementById('rf').onsubmit = async ev => {
    ev.preventDefault();
    const f = Object.fromEntries(new FormData(ev.target));
    const b = document.getElementById('rbtn'); b.disabled = true; b.textContent = '저장 중…';
    try {
      await api('reserve', { vehicleId: vid, ...f }, true);
      localStorage.setItem(LAST, f.name); localStorage.setItem(LAST_DEPT, f.dept);
      toast('예약되었습니다'); await load();
    } catch (e) { toast(e.message, false); b.disabled = false; b.textContent = '예약하기'; }
  };
}

async function cancelRes(id) {
  const pin = prompt('예약할 때 정한 취소번호(숫자 4자리)를 입력하세요');
  if (pin === null || pin.trim() === '') return;
  try { await api('cancelRes', { id, pin }, true); toast('예약이 취소되었습니다'); await load(); }
  catch (e) { toast(e.message, false); }
}

load();
</script>
</body>
</html>
